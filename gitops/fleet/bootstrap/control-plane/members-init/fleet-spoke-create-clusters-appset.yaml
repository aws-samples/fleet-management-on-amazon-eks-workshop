apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet-spoke-create-clusters
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - clusters:
      selector:
        matchLabels:
          fleet_member: control-plane
      values:
        bootstrap: charts/kro-clusters/
  template:
    metadata:
      name: fleet-members-create
      labels:      
        environment: '{{metadata.labels.environment}}'
        tenant: '{{metadata.labels.tenant}}'
    spec:
      project: default
      sources:
      - repoURL: '{{.metadata.annotations.fleet_repo_url}}'
        path: '{{.metadata.annotations.fleet_repo_basepath}}{{.values.bootstrap}}'
        targetRevision: '{{.metadata.annotations.fleet_repo_revision}}'
        helm:
          releaseName: 'kro-clusters'
          ignoreMissingValueFiles: true
          valueFiles:
            - '$values/{{metadata.annotations.fleet_repo_basepath}}kro-values/{{path.basename}}/defaults/kro-clusters/values.yaml'
            - '$values/{{metadata.annotations.fleet_repo_basepath}}kro-values/{{path.basename}}/tenants/{{metadata.labels.tenant}}/kro-clusters/values.yaml'
      destination:
        namespace: argocd
        name: '{{.name}}'
      syncPolicy:
        automated:
          selfHeal: true
          allowEmpty: true
          prune: false
        retry:
          limit: 100
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true  # Big CRDs.